<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- 토글 스위치 목록: 안 쓰는 툴 하나를 끈다 = 전역 조치 -->
  <g fill="none" stroke="#8b8b8b" stroke-width="2.5" stroke-linecap="round">
    <!-- 켜진 스위치 1 -->
    <line x1="290" y1="122" x2="404" y2="122" />
    <rect x="440" y="100" width="80" height="44" rx="22" />
    <circle cx="498" cy="122" r="14" fill="#8b8b8b" stroke="none" />
    <!-- 켜진 스위치 2 -->
    <line x1="290" y1="212" x2="404" y2="212" />
    <rect x="440" y="190" width="80" height="44" rx="22" />
    <circle cx="498" cy="212" r="14" fill="#8b8b8b" stroke="none" />
    <!-- 꺼진 스위치 (점선 라벨 = 이제 로드되지 않는 툴) -->
    <line x1="290" y1="302" x2="404" y2="302" stroke-dasharray="4 8" />
    <rect x="440" y="280" width="80" height="44" rx="22" stroke-dasharray="5 7" />
    <circle cx="462" cy="302" r="14" />
  </g>
  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8b8b8b">Act</text>
</svg>
