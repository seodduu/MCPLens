<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Dependency graph: nodes branching from the root tool, with one standing alone (independent) -->
  <g fill="none" stroke="#8b8b8b" stroke-width="2.5" stroke-linecap="round">
    <!-- edges (up to the node border only) -->
    <line x1="379" y1="136" x2="318" y2="212" />
    <line x1="421" y1="136" x2="482" y2="212" />
    <line x1="300" y1="264" x2="300" y2="304" />
    <line x1="479" y1="258" x2="418" y2="310" />
    <line x1="521" y1="258" x2="568" y2="308" />
    <!-- nodes -->
    <circle cx="400" cy="110" r="34" />
    <circle cx="300" cy="238" r="28" />
    <circle cx="500" cy="238" r="28" />
    <circle cx="300" cy="330" r="24" />
    <circle cx="400" cy="330" r="24" fill="#8b8b8b" fill-opacity="0.25" />
    <circle cx="586" cy="330" r="24" stroke-dasharray="5 7" />
    <!-- root node marker -->
    <circle cx="400" cy="110" r="10" fill="#8b8b8b" stroke="none" />
  </g>
  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8b8b8b">Analyze</text>
</svg>
