    <circle cx="400" cy="70" r="6" fill="#8b8b8b" stroke="none" />
    <circle cx="460" cy="92" r="6" fill="#8b8b8b" stroke="none" />
    <circle cx="372" cy="112" r="6" fill="#8b8b8b" stroke="none" />
    <circle cx="432" cy="116" r="6" fill="#8b8b8b" stroke="none" />
